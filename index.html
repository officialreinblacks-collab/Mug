<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reinblacks Creativz | Premium Creative Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* ============================================================
   ROOT VARIABLES & RESET
============================================================ */
:root{
  --black:#000000;
  --dark:#0a0a0a;
  --card:#141414;
  --card2:#1a1a1a;
  --red:#E50914;
  --red-dark:#b00710;
  --red-glow:rgba(229,9,20,0.6);
  --white:#ffffff;
  --gray:#808080;
  --lgray:#b3b3b3;
  --glass:rgba(0,0,0,0.65);
  --font-display:'Bebas Neue',cursive;
  --font-body:'Outfit',sans-serif;
  --font-alt:'Rajdhani',sans-serif;
  --nav-h:70px;
  --radius:8px;
  --trans:all 0.35s cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{
  background:var(--black);
  color:var(--white);
  font-family:var(--font-body);
  overflow-x:hidden;
  line-height:1.6;
  cursor:default;
}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;background:none;font-family:inherit}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#111}
::-webkit-scrollbar-thumb{background:var(--red);border-radius:2px}
::selection{background:var(--red);color:#fff}

/* ============================================================
   LOADING / INTRO SCREEN
============================================================ */
#intro{
  position:fixed;inset:0;z-index:9999;
  background:#000;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  transition:opacity 0.8s ease, visibility 0.8s ease;
}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}

#intro canvas{position:absolute;inset:0;width:100%;height:100%}

.intro-logo{
  position:relative;z-index:2;
  display:flex;align-items:center;gap:6px;
  animation:introLogoFade 0.8s ease 0.3s both;
}
.intro-logo .r{
  font-family:var(--font-display);
  font-size:clamp(80px,12vw,130px);
  color:var(--red);
  text-shadow:0 0 30px var(--red),0 0 80px var(--red),0 0 140px rgba(229,9,20,0.4);
  animation:logoPulse 2s ease-in-out infinite;
  line-height:1;
}
.intro-logo .c{
  font-family:var(--font-display);
  font-size:clamp(80px,12vw,130px);
  color:#fff;
  text-shadow:0 0 30px rgba(255,255,255,0.6),0 0 80px rgba(255,255,255,0.2);
  animation:logoPulse 2s ease-in-out 0.3s infinite;
  line-height:1;
}
.intro-tagline{
  position:relative;z-index:2;
  font-family:var(--font-alt);
  letter-spacing:0.6em;
  font-size:clamp(10px,1.5vw,14px);
  color:var(--lgray);
  text-transform:uppercase;
  margin-top:-8px;
  animation:introLogoFade 0.8s ease 0.8s both;
}
.intro-bar-wrap{
  position:absolute;bottom:0;left:0;right:0;
  height:4px;background:rgba(255,255,255,0.08);
  z-index:2;
}
.intro-bar{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--red-dark),var(--red),#ff3d3d);
  box-shadow:0 0 20px var(--red-glow);
  transition:width 0.05s linear;
}

@keyframes introLogoFade{from{opacity:0;transform:scale(0.85)}to{opacity:1;transform:scale(1)}}
@keyframes logoPulse{
  0%,100%{text-shadow:0 0 30px var(--red),0 0 80px var(--red),0 0 140px rgba(229,9,20,0.4)}
  50%{text-shadow:0 0 60px var(--red),0 0 120px var(--red),0 0 200px rgba(229,9,20,0.7),0 0 280px rgba(229,9,20,0.3)}
}
  /* ============================================================
   NAVIGATION
============================================================ */
#navbar{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  height:var(--nav-h);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 4%;
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  background:linear-gradient(to bottom,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0) 100%);
  transition:background 0.4s ease;
}
#navbar.scrolled{
  background:rgba(0,0,0,0.95);
  box-shadow:0 2px 30px rgba(0,0,0,0.8);
}

/* Logo */
.nav-logo{display:flex;align-items:center;gap:12px;cursor:pointer}
.nav-logo-mark{
  display:flex;flex-direction:column;align-items:center;
  border-left:3px solid var(--red);
  padding-left:10px;
  gap:0;
}
.nav-logo-mark .logo-r{
  font-family:var(--font-display);
  font-size:32px;line-height:1;
  color:var(--red);
  text-shadow:0 0 20px var(--red-glow);
}
.nav-logo-mark .logo-c{
  font-family:var(--font-display);
  font-size:32px;line-height:1;
  color:#fff;
}
.nav-logo-text{
  display:flex;flex-direction:column;line-height:1.1;
}
.nav-logo-text .brand{
  font-family:var(--font-alt);
  font-size:13px;font-weight:700;
  letter-spacing:0.1em;
  color:var(--red);
}
.nav-logo-text .home-lbl{
  font-family:var(--font-alt);
  font-size:10px;
  letter-spacing:0.4em;
  color:var(--lgray);
  text-transform:uppercase;
}

/* Nav Center - Search */
.nav-center{display:flex;align-items:center;gap:16px}
.search-wrap{
  position:relative;display:flex;align-items:center;
}
.search-btn{
  width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;
  color:var(--white);font-size:16px;
  border-radius:50%;transition:var(--trans);
  cursor:pointer;
}
.search-btn:hover{background:rgba(255,255,255,0.1);color:var(--red)}
.search-input-wrap{
  position:absolute;left:0;
  display:flex;align-items:center;
  background:rgba(0,0,0,0.9);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:4px;
  overflow:hidden;
  width:0;opacity:0;
  transition:width 0.4s ease, opacity 0.3s ease;
  pointer-events:none;
}
.search-input-wrap.open{width:280px;opacity:1;pointer-events:all}
.search-input-wrap input{
  flex:1;padding:10px 14px;
  background:none;border:none;outline:none;
  color:#fff;font-family:var(--font-body);font-size:14px;
}
.search-input-wrap input::placeholder{color:var(--gray)}
.search-input-wrap .s-close{
  padding:0 12px;color:var(--gray);font-size:14px;cursor:pointer;
}
.search-input-wrap .s-close:hover{color:#fff}

/* Search Dropdown */
.search-dropdown{
  position:absolute;top:calc(100% + 8px);left:0;
  width:380px;max-width:90vw;
  background:rgba(10,10,10,0.98);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:var(--radius);
  box-shadow:0 20px 60px rgba(0,0,0,0.8);
  max-height:400px;overflow-y:auto;
  display:none;z-index:999;
}
.search-dropdown.show{display:block}
.s-result-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;cursor:pointer;
  transition:background 0.2s;
  border-bottom:1px solid rgba(255,255,255,0.04);
}
.s-result-item:hover{background:rgba(229,9,20,0.1)}
.s-result-thumb{
  width:56px;height:36px;
  object-fit:cover;border-radius:4px;
  flex-shrink:0;background:#222;
}
.s-result-info{flex:1;min-width:0}
.s-result-title{
  font-size:13px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.s-result-cat{font-size:11px;color:var(--red);margin-top:2px;text-transform:uppercase;letter-spacing:0.05em}
.s-highlight{color:var(--red);font-weight:700}
.s-no-result{padding:20px;text-align:center;color:var(--gray);font-size:13px}

/* Nav Right */
.nav-right{display:flex;align-items:center;gap:8px}
.nav-icon-btn{
  width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;
  color:var(--lgray);font-size:16px;
  border-radius:50%;transition:var(--trans);
  cursor:pointer;position:relative;
}
.nav-icon-btn:hover{color:#fff;background:rgba(255,255,255,0.08)}
.nav-icon-btn.bell:hover{color:var(--red)}
.notif-dot{
  position:absolute;top:6px;right:6px;
  width:8px;height:8px;
  background:var(--red);border-radius:50%;
  border:2px solid #000;
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--red-glow)}50%{box-shadow:0 0 0 6px transparent}}

.profile-btn{
  width:36px;height:36px;
  background:linear-gradient(135deg,var(--red),#ff6b6b);
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:18px;
  cursor:pointer;transition:var(--trans);
  box-shadow:0 0 15px rgba(229,9,20,0.4);
}
.profile-btn:hover{transform:scale(1.08);box-shadow:0 0 25px rgba(229,9,20,0.7)}

/* Profile Modal */
.profile-modal-bg{
  position:fixed;inset:0;z-index:2000;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(6px);
  display:none;align-items:flex-start;justify-content:flex-end;
  padding:80px 4% 0;
}
.profile-modal-bg.open{display:flex}
.profile-modal{
  background:rgba(15,15,15,0.98);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  padding:28px;
  width:320px;
  box-shadow:0 30px 80px rgba(0,0,0,0.9);
  animation:modalSlide 0.3s ease;
}
@keyframes modalSlide{from{opacity:0;transform:translateY(-15px)}to{opacity:1;transform:translateY(0)}}
.profile-modal h3{
  font-family:var(--font-alt);font-size:20px;font-weight:600;
  margin-bottom:20px;letter-spacing:0.05em;
  color:#fff;
}
.profile-modal h3 span{color:var(--red)}
.pm-avatar{
  width:72px;height:72px;
  background:linear-gradient(135deg,var(--red),#ff6b6b);
  border-radius:50%;margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:32px;
  box-shadow:0 0 30px rgba(229,9,20,0.5);
}
.pm-field{margin-bottom:14px}
.pm-field label{display:block;font-size:12px;color:var(--lgray);margin-bottom:6px;letter-spacing:0.05em;text-transform:uppercase}
.pm-field input{
  width:100%;padding:11px 14px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:6px;
  color:#fff;font-family:var(--font-body);font-size:14px;
  outline:none;transition:border-color 0.2s;
}
.pm-field input:focus{border-color:var(--red)}
.pm-btn{
  width:100%;padding:13px;
  background:var(--red);
  border-radius:6px;
  color:#fff;font-family:var(--font-body);font-size:14px;font-weight:600;
  letter-spacing:0.05em;
  margin-top:8px;transition:var(--trans);
}
.pm-btn:hover{background:var(--red-dark);box-shadow:0 0 20px rgba(229,9,20,0.4)}
.pm-close{
  position:absolute;top:16px;right:16px;
  color:var(--gray);font-size:18px;cursor:pointer;
  transition:color 0.2s;
}
.pm-close:hover{color:#fff}
.profile-modal{position:relative}
  
  
/* ============================================================
   CATEGORY BAR
============================================================ */
#cat-bar{
  position:relative;z-index:50;
  padding:calc(var(--nav-h) + 12px) 4% 0;
  display:flex;gap:10px;
  overflow-x:auto;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
#cat-bar::-webkit-scrollbar{display:none}

.cat-btn{
  flex-shrink:0;
  padding:8px 20px;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:20px;
  color:var(--lgray);
  font-family:var(--font-body);font-size:13px;font-weight:500;
  letter-spacing:0.03em;
  transition:var(--trans);
  cursor:pointer;
  white-space:nowrap;
}
.cat-btn:hover,.cat-btn.active{
  background:rgba(229,9,20,0.15);
  border-color:var(--red);
  color:#fff;
  box-shadow:0 0 16px rgba(229,9,20,0.3),inset 0 0 16px rgba(229,9,20,0.05);
  text-shadow:0 0 10px rgba(229,9,20,0.5);
}

/* ============================================================
   HERO SECTION
============================================================ */
#hero{
  position:relative;
  height:100vh;min-height:600px;
  overflow:hidden;
  display:flex;align-items:flex-end;
  padding:0 4% 8%;
}
.hero-video-wrap{
  position:absolute;inset:0;z-index:0;
  overflow:hidden;
}
.hero-video-wrap iframe{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:177.78vh;height:100vh;
  min-width:100%;min-height:56.25vw;
  pointer-events:none;
  filter:brightness(0.55);
}
.hero-overlay{
  position:absolute;inset:0;z-index:1;
  background:linear-gradient(
    to right,
    rgba(0,0,0,0.85) 0%,
    rgba(0,0,0,0.4) 50%,
    rgba(0,0,0,0) 100%
  ),
  linear-gradient(
    to top,
    rgba(0,0,0,0.95) 0%,
    rgba(0,0,0,0) 60%
  );
}
.hero-content{
  position:relative;z-index:2;
  max-width:680px;
  animation:heroIn 1.2s cubic-bezier(0.4,0,0.2,1) 0.3s both;
}
@keyframes heroIn{from{opacity:0;transform:translateY(40px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}

.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(229,9,20,0.2);
  border:1px solid rgba(229,9,20,0.4);
  border-radius:20px;
  padding:6px 16px;
  font-size:12px;font-weight:600;
  letter-spacing:0.15em;text-transform:uppercase;
  color:var(--red);
  margin-bottom:16px;
  box-shadow:0 0 20px rgba(229,9,20,0.2);
}
.hero-badge i{font-size:10px}

.hero-title{
  font-family:var(--font-display);
  font-size:clamp(36px,5.5vw,72px);
  line-height:1.05;
  letter-spacing:0.02em;
  margin-bottom:10px;
  text-shadow:0 2px 30px rgba(0,0,0,0.8);
}
.hero-title span{color:var(--red)}

.hero-sub{
  font-family:var(--font-alt);
  font-size:clamp(14px,2vw,20px);
  font-weight:400;letter-spacing:0.1em;
  color:var(--lgray);margin-bottom:20px;
  text-transform:uppercase;
}

.hero-desc{
  font-size:14px;color:var(--lgray);
  max-width:460px;line-height:1.7;margin-bottom:28px;
}

.hero-actions{display:flex;gap:14px;flex-wrap:wrap}
.btn-primary{
  display:inline-flex;align-items:center;gap:10px;
  padding:14px 32px;
  background:var(--red);
  border-radius:6px;
  font-weight:700;font-size:15px;
  letter-spacing:0.04em;
  transition:var(--trans);
  box-shadow:0 0 30px rgba(229,9,20,0.4);
}
.btn-primary:hover{background:var(--red-dark);transform:scale(1.03);box-shadow:0 0 50px rgba(229,9,20,0.6)}
.btn-secondary{
  display:inline-flex;align-items:center;gap:10px;
  padding:14px 32px;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.2);
  backdrop-filter:blur(10px);
  border-radius:6px;
  font-weight:600;font-size:15px;
  letter-spacing:0.04em;
  transition:var(--trans);
}
.btn-secondary:hover{background:rgba(255,255,255,0.2);border-color:rgba(255,255,255,0.4)}

.hero-scroll-hint{
  position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
  z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;
}
.scroll-line{
  width:1px;height:40px;
  background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.5),transparent);
  animation:scrollHint 2s ease-in-out infinite;
}
@keyframes scrollHint{0%,100%{opacity:0.3;transform:scaleY(0.8)}50%{opacity:1;transform:scaleY(1)}}

  
/* ============================================================
   SECTION LAYOUT
============================================================ */
.content-section{
  padding:50px 0 20px;
  position:relative;
  animation:sectionFadeIn 0.8s ease both;
}
@keyframes sectionFadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.section-header{
  padding:0 4%;
  margin-bottom:20px;
  display:flex;align-items:flex-end;justify-content:space-between;
  flex-wrap:wrap;gap:12px;
}
.section-title{
  font-family:var(--font-display);
  font-size:clamp(22px,3.5vw,36px);
  letter-spacing:0.03em;
  position:relative;
  display:inline-flex;align-items:center;gap:14px;
}
.section-title::before{
  content:'';
  width:4px;height:1em;
  background:var(--red);
  border-radius:2px;
  box-shadow:0 0 10px var(--red-glow);
  flex-shrink:0;
}
.section-desc{
  font-size:14px;color:var(--lgray);
  max-width:600px;line-height:1.7;
  margin-top:10px;
  padding:0 4%;
  margin-bottom:24px;
}
.see-all{
  font-size:13px;color:var(--red);
  font-weight:600;letter-spacing:0.04em;
  cursor:pointer;
  display:flex;align-items:center;gap:6px;
  transition:color 0.2s;
  white-space:nowrap;
}
.see-all:hover{color:#ff4444}

/* ============================================================
   NETFLIX SLIDER
============================================================ */
.slider-wrap{position:relative}
.slider-track-outer{
  position:relative;
  overflow:hidden;
}
.slider-track{
  display:flex;
  gap:12px;
  padding:16px 4%;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  -ms-overflow-style:none;
  transition:transform 0.4s ease;
}
.slider-track::-webkit-scrollbar{display:none}

.slider-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  width:44px;height:100%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.6);
  cursor:pointer;z-index:10;
  opacity:0;transition:opacity 0.3s ease;
  font-size:20px;color:#fff;
}
.slider-arrow:hover{background:rgba(0,0,0,0.85)}
.slider-arrow.left{left:0;background:linear-gradient(to right,rgba(0,0,0,0.9),transparent)}
.slider-arrow.right{right:0;background:linear-gradient(to left,rgba(0,0,0,0.9),transparent)}
.slider-wrap:hover .slider-arrow{opacity:1}

/* ============================================================
   VIDEO CARD
============================================================ */
.video-card{
  flex-shrink:0;
  width:clamp(200px,24vw,280px);
  scroll-snap-align:start;
  cursor:pointer;
  border-radius:var(--radius);
  overflow:hidden;
  position:relative;
  transition:transform 0.35s cubic-bezier(0.4,0,0.2,1), box-shadow 0.35s ease, z-index 0s 0.35s;
  background:var(--card);
}
.video-card:hover{
  transform:scale(1.08) translateY(-8px);
  box-shadow:0 20px 60px rgba(0,0,0,0.8),0 0 30px rgba(229,9,20,0.2);
  z-index:20;
  transition:transform 0.35s cubic-bezier(0.4,0,0.2,1), box-shadow 0.35s ease, z-index 0s;
}
.vc-thumb{
  position:relative;width:100%;
  padding-top:56.25%;
  background:#111;overflow:hidden;
}
.vc-thumb img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;
  transition:transform 0.4s ease, filter 0.4s ease;
}
.video-card:hover .vc-thumb img{transform:scale(1.05);filter:brightness(0.65)}

.vc-overlay{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0);
  transition:background 0.3s ease;
}
.video-card:hover .vc-overlay{background:rgba(0,0,0,0.3)}
.vc-play{
  width:52px;height:52px;
  background:rgba(229,9,20,0.9);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
  opacity:0;transform:scale(0.7);
  transition:opacity 0.3s ease, transform 0.3s ease;
  box-shadow:0 0 30px rgba(229,9,20,0.7);
}
.video-card:hover .vc-play{opacity:1;transform:scale(1)}

.vc-duration{
  position:absolute;bottom:8px;right:8px;
  background:rgba(0,0,0,0.8);
  padding:2px 8px;border-radius:4px;
  font-size:12px;font-weight:600;
}

.vc-info{
  padding:12px 14px;
  background:linear-gradient(to bottom,var(--card),var(--card2));
}
.vc-title{
  font-size:13px;font-weight:700;

// Open Photo Gallery Modal
function openPhotoGallery(event) {
  event.stopPropagation();
  const modal = document.getElementById('photoGalleryModal');
  const grid = document.getElementById('photoGalleryGrid');
  
  // Clear previous items
  grid.innerHTML = '';
  
  // Populate gallery
  photoCloneCollection.forEach((photoSrc, index) => {
    const item = document.createElement('div');
    item.className = 'photo-gallery-item';
    item.innerHTML = `
      <img src="${photoSrc}" alt="Photo ${index + 1}">
      <div class="pgi-overlay">
        <i class="fas fa-expand pgi-expand-icon"></i>
      </div>
    `;
    item.onclick = (e) => {
      e.stopPropagation();
      openExpandedPhoto(photoSrc);
    };
    grid.appendChild(item);
  });
  
  modal.classList.add('open');
}

// Close Photo Gallery Modal
function closePhotoGallery() {
  document.getElementById('photoGalleryModal').classList.remove('open');
  closeExpandedPhoto();
}

// Open Expanded Photo View
function openExpandedPhoto(photoSrc) {
  const expandedView = document.getElementById('expandedPhotoView');
  const expandedImg = document.getElementById('expandedPhoto');
  expandedImg.src = photoSrc;
  expandedView.classList.add('open');
}

// Close Expanded Photo View
function closeExpandedPhoto() {
  document.getElementById('expandedPhotoView').classList.remove('open');
}

// Close modals on background click
document.getElementById('photoGalleryModal')?.addEventListener('click', function(e) {
  if (e.target === this) closePhotoGallery();
});

document.getElementById('expandedPhotoView')?.addEventListener('click', function(e) {
  if (e.target === this) closeExpandedPhoto();
});

// Prevent body scroll when modal is open
const observer = new MutationObserver(() => {
  const isModalOpen = document.getElementById('photoGalleryModal')?.classList.contains('open');
  document.body.style.overflow = isModalOpen ? 'hidden' : 'auto';
});

observer.observe(document.getElementById('photoGalleryModal') || document.body, {
  attributes: true,
  attributeFilter: ['class']
});
</script>
